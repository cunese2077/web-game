# GitHub Pages 自动部署
# 触发：push 到 main 分支
# 流程：npm ci → ESLint → 单元测试 → tsc + vite build → 发布 dist/ 到 Pages
# lint 或测试失败会阻止部署
# 前置条件（一次性）：仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 支持手动触发
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint 检查（失败则中止部署）
        run: npm run lint

      - name: 单元测试（失败则中止部署）
        run: npm test

      - name: Build（tsc 类型检查 + vite build）
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
