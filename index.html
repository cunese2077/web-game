<!DOCTYPE html>
<html>
  <head>
    <title>飞机大战</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- PWA：应用清单 + iOS 主屏图标 + 状态栏颜色 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <style type="text/css">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        /* 桌面端画布居中显示，移动端铺满无偏移 */
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000;
      }
      canvas {
        display: block;
        /* 画布尺寸由 JS 控制（canvas.ts），CSS 不设置 width/height
           避免移动端 100vh/100lvh 随地址栏变化导致的"慢慢拉伸"问题 */
        background-color: #ddd;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"> 您的浏览器不支持canvas绘图!!!</canvas>
    <div id="div"></div>
    <!-- Vite 入口：dev 模式由 Vite 转译 TS 并提供 HMR；构建时打包压缩 -->
    <script type="module" src="/src/engine.ts"></script>
  </body>
</html>
